name: checks

# Two jobs, deliberately kept apart.
#
# `checks` is static: no database, no services started, nothing to install beyond
# the packages. It either passes or something is genuinely wrong.
#
# `tests` runs the black-box suite, which starts the real services and drives them
# from the outside against a throwaway MongoDB the tests supply themselves. Still no
# Atlas cluster and no Arduino — the Arduino serial capture is the one part of the
# system that cannot be tested without the hardware attached.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: No credentials in the repository
        run: ./scripts/check-secrets.sh

      - name: Services install cleanly
        run: |
          cd src/groceryfrontend && npm ci
          cd ../newserver && npm ci

      - name: JavaScript parses
        run: |
          for f in src/groceryfrontend/frontserver.js \
                   src/newserver/dbservice.js \
                   src/newserver/simulator.js; do
            node --check "$f" && echo "  ok  $f"
          done

      - name: Shell script parses
        run: bash -n src/newserver/bashservice.sh

      - name: Sample scan data is valid JSON and has the expected shape
        run: |
          node -e '
            const data = require("./src/newserver/data.json");
            if (!Array.isArray(data) || data.length === 0) {
              throw new Error("data.json must be a non-empty array");
            }
            data.forEach((entry, i) => {
              for (const field of ["input", "timestamp"]) {
                if (!(field in entry)) throw new Error(`entry ${i} is missing ${field}`);
              }
              if (!/^\d{3}$/.test(entry.input)) {
                throw new Error(`entry ${i}: input "${entry.input}" is not a 3-digit code`);
              }
              if (Number.isNaN(Date.parse(entry.timestamp))) {
                throw new Error(`entry ${i}: timestamp "${entry.timestamp}" is not a date`);
              }
            });
            console.log(`${data.length} sample scans, all fields present`);
          '

      - name: Services refuse to start without configuration
        run: |
          cd src/newserver
          if node dbservice.js; then
            echo "dbservice.js should have exited non-zero with no MONGO_URL"
            exit 1
          fi
          echo "  ok  dbservice.js fails closed"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # mongodb-memory-server downloads a mongod binary on first use. Where it puts
      # it varies by platform, so the location is pinned here rather than guessed —
      # otherwise the cache silently never matches and the binary is downloaded
      # again on every run.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0

      - name: Run the test suite
        run: make test
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
