# A complete, self-contained demonstration of the system.
#
#   docker compose up
#   open http://localhost:4000   (customer number: 1234)
#
# No MongoDB Atlas account, no Arduino, no configuration. The database runs locally, the
# pantry is seeded with four products and five scans, and the processing interval is
# dropped from a minute to three seconds so the effect of a scan is visible immediately.
#
# The credentials here are demonstration values for a throwaway local database. Nothing in
# this file is a real secret, which is the point: the production path reads the same
# variables from a .env that is never committed.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo-data:/data/db

  # Runs once, then exits. The frontend waits for it so the UI is never shown against an
  # empty database.
  seed:
    build: ./src/newserver
    command: ["node", "seed.js"]
    environment:
      MONGO_URL: mongodb://mongo:27017/grocerydb
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./src/groceryfrontend
    ports:
      - "4000:4000"
    environment:
      MONGO_URL: mongodb://mongo:27017/grocerydb
      CUSTOMER_NUMBER: "1234"
      PROCESS_INTERVAL_MS: "3000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  mongo-data:
